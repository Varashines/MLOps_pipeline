[project]
name = "learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dagster>=1.12.8",
    "dagster-dg-cli>=1.12.8",
    "dagster-webserver>=1.12.8",
    "evidently>=0.7.18",
    "pandas>=2.3.3",
    "pydantic>=2.12.5",
]

[tool.dg]
directory_type = "project"
cli.suppress_warnings = ["project_and_activated_venv_mismatch"]

[tool.dg.project]
root_module = "orchestration"
# This points to the definitions.py file we are about to create
code_location_target_module = "orchestration.definitions"
